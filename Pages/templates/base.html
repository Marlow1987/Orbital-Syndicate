{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Orbital Syndicate{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'style/base.css' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/16x16.png' %}">
    <link rel="icon" type="image/png" sizes="48x48" href="{% static 'images/48x48.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/180x180.png' %}">
</head>
<body class="bg-dark text-light">
    <header class="navbar">
        <nav class="container">
            <div class="logo">
                <a href="{% url 'home' %}">
                    <img src="{% static 'images/logo.png' %}" height="70" alt="Orbital Syndicate Logo">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="#">Games</a></li>
                <li><a href="#">Devlog</a></li>
                <li><a href="#">Manifesto</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="content-wrapper">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-info">
                    <p>&copy; 2026 Orbital Syndicate. All systems operational.</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
